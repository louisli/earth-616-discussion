name: orchestrator

# AGENTS.md section 12. Runs every 5 minutes; only one run at a time.
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would happen without changing anything'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: orchestrator
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: orchestrator
        run: node --test test/unit.test.js
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCH_SECRET: ${{ secrets.ORCH_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node orchestrator/src/main.js
