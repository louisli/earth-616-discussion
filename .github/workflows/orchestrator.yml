name: orchestrator

# AGENTS.md section 12 and 14.7. One run at a time.
# Times are UTC: the `timezone:` key never fired here, so these are plain UTC crons.
# While New York is on EDT (UTC-4), UTC even hours = ET even hours:
#   :55 of every odd hour = prep for the next cycle; :00 = prep fallback; :25 = review sheets; :47 = tally.
# When New York switches to EST (UTC-5, first Sunday of November), swap the hour lists:
#   '55 0-22/2 * * *' and '0,25,47 1-23/2 * * *'. Switch back in March.
on:
  schedule:
    - cron: '55 1-23/2 * * *'
    - cron: '0,25,47 0-22/2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would happen without changing anything'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: orchestrator
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: orchestrator
        run: node --test test/unit.test.js
      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node orchestrator/src/main.js
